version: '3.9'

services:
  backend:
    build: ./backend
    container_name: api-sentinel-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: api-sentinel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
